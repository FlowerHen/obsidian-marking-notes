feature_name: "Marking Note 完整 AI 阅读辅助系统与 UI/交互重整"
problem_statement: >-
  marking-note-refactor 已经具备 AI 标注、管家、快捷指令、原文改写和侧边栏基础，
  但当前 UI 职责分散，a 类对话、b 类改写、c 类增补和 d 类链接没有统一的操作模型；
  c 类独立复制流程和 d 类原生链接入口缺失，状态语义也不能准确表达用户的阅读掌握过程。
  本次工作要在保留选中文本操作入口的前提下，重整桌面与移动端 UI/交互，补齐完整功能，
  并建立可迁移、可恢复、可由用户直接编辑的文档数据格式。
actors:
  - "单用户、本地 Obsidian Vault 的阅读者和笔记作者"
constraints:
  - "桌面端与移动端同等支持；桌面端使用选区附近操作栏，移动端使用底部四按钮操作栏，并避开软键盘和安全区域。"
  - "选中文本后的一级操作固定为：对话、改写、增补、链接。"
  - "a、b、c 三类 AI 操作使用当前活动管家；每个管家拥有独立的快捷指令集合，支持新增、编辑、删除、排序和默认指令。"
  - "d 类不经过 AI，保留选中文本作为显示文本并调用 Obsidian 原生链接选择流程，支持文档、标题和块。"
  - "a 类先选择管家快捷指令，再创建标注并生成结果；生成完成后打开当前标注对话弹窗。"
  - "a 类划线弹窗负责当前标注的查看、继续对话、编辑、复制、撤回和删除；侧边栏默认管理当前文档，并提供 Vault 全局入口。"
  - >-
    a 类完整对话历史保存在当前 Vault 的插件 data.json；当前文档只保存最终结果。
    历史最多保存由实现方案定义的可控数量，并在标注删除时同步删除。
  - "b 类 AI 返回后立即替换选区；改写进入 Obsidian 原生撤销栈，Ctrl+Z 和 Notice 撤回按钮都可撤回。"
  - "c 类 AI 返回后立即写入系统剪贴板并显示 Notice；Notice 提供再次复制按钮；c 类不写入当前文档，也不保存生成历史。"
  - "正文使用轻量、稳定的标注 ID；当前结果统一保存到当前文档底部专用结果区。"
  - >-
    结果区使用插件自定义 fenced result block，块内容人类可读、可直接编辑，保存 ID、
    四阶段状态、标签、摘要和当前 Markdown 结果正文。
  - "状态采用四阶段线性模型：未处理、已标注、已复核、已掌握。AI 成功后自动进入已标注，后续状态由用户手动推进且允许退回。"
  - "AI 请求失败时保留标注并保持未处理，结果区提供失败状态和重试入口，不留下半成品 AI 结果。"
  - "手动编辑正文时自动维护关联：删除正文标注会删除结果块和 data.json 历史，删除结果块会保留正文标注并使其回到未处理，移动结果块不影响关联。"
  - "旧格式只通过用户手动执行的当前文档迁移命令转换；迁移原地执行、不创建备份、不批量扫描 Vault，整次迁移通过一次 Ctrl+Z 撤回。"
  - "系统面向单用户本地 Vault，不设计多人协作、用户区分或跨 Vault 历史共享。"
out_of_scope:
  - "首个完整版本的整个 Vault 批量迁移。"
  - "多人共享 Vault 的用户隔离、并发冲突和协作历史。"
  - "c 类结果自动插入当前文档或保存为插件历史。"
  - "d 类链接操作中的 AI 推荐、AI 解析或自定义链接选择器。"
  - "继续把旧版行内标记和 ai-footnote Callout 作为新系统的长期规范格式。"
  - "用自定义快捷键覆盖 Ctrl+C；Ctrl+C 保持复制语义。"
key_decisions:
  - decision: "保留选中文本后的四操作入口，并重新组织 UI 和交互"
    rationale: "用户希望保留现有核心操作模型，同时解决入口分散、职责不清和桌面/移动端体验不一致的问题。"
  - decision: "a、b、c 使用当前活动管家，d 使用 Obsidian 原生功能"
    rationale: "管家统一阅读理解、写作风格和快捷指令；原生链接不应引入不必要的 AI 处理。"
  - decision: "划线弹窗负责当前标注，侧边栏负责文档级和 Vault 级管理"
    rationale: "将即时操作与全局管理分开，减少弹窗承担过多列表和筛选职责。"
  - decision: "对话历史保存到插件 data.json，最终结果保存到当前 Markdown 文档"
    rationale: "正文保持可读，历史在 Obsidian 重启后仍可恢复，同时不把完整聊天记录写入文章。"
  - decision: "采用新的轻量行内标记和自定义 fenced result block"
    rationale: "需要稳定表达 ID、状态、标签和结果，并支持插件可靠解析、迁移、同步和用户直接编辑。"
  - decision: "迁移由用户手动触发，当前文档原地转换且不创建备份"
    rationale: "避免未经确认批量修改 Vault；用户明确选择依赖 Obsidian 单次撤销恢复迁移。"
  - decision: "AI 失败保留未处理标注并支持重试"
    rationale: "避免用户丢失选择范围，同时不把失败响应误记为有效结果。"
success_criteria:
  - "桌面端和移动端选中文本后都能发现并使用四个一级操作。"
  - "用户可以选择管家指令完成对话标注，从划线末端继续对话、查看历史并撤回上一轮。"
  - "用户可以使用改写指令立即替换原文，并通过 Ctrl+Z 或 Notice 撤回。"
  - "用户可以使用增补指令生成内容，结果自动进入剪贴板并可从 Notice 再次复制。"
  - "用户可以使用链接操作调用 Obsidian 原生选择器，将当前选中文本链接到文档、标题或块。"
  - "关闭并重新打开 Obsidian 后，标注结果、状态、标签和对话历史仍能正确关联。"
  - "手动删除或移动标注和结果块时，插件能按规则维护关联，不产生无法解释的孤立数据。"
  - "用户可以手动迁移当前旧格式文档，迁移作为单次编辑事务并可通过 Ctrl+Z 整体撤回。"
