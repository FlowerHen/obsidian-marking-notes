---
core_value: "让 Obsidian 用户在阅读过程中用统一、可恢复且不打断正文的 AI 工作流完成对话探究、原文改写、内容增补和文档链接。"
summary: >-
  本次 initiative 重整 Marking Note 的完整阅读辅助体验。用户在桌面或移动端选中文本后，
  可以从统一的四项操作入口进入对话、改写、增补或链接流程；AI 操作受当前管家和其快捷指令控制，
  原生链接操作保持 Obsidian 的选择体验。当前标注弹窗负责即时工作，侧边栏负责当前文档和 Vault 级管理。

  本次工作同时建立新的标注结果表达和对话历史边界，使正文、当前 AI 结果、标注状态、标签和完整对话记录
  可以分别管理，并在用户重启 Obsidian 后保持关联。旧格式只通过用户主动执行的当前文档迁移进入新格式，
  不扩大为自动批量转换或多人协作系统。
in_scope:
  - epic_id: e01
    title: "统一操作入口与响应式 UI/交互"
    outcome: "桌面和移动端都能从选中文本进入四类操作，并通过清晰的弹窗、底部操作栏和侧边栏完成工作。"
  - epic_id: e02
    title: "管家驱动的对话标注与历史"
    outcome: "用户可以选择管家快捷指令生成标注结果、继续对话、撤回并恢复持久化历史。"
  - epic_id: e03
    title: "原文改写、增补复制与原生链接"
    outcome: "用户可以安全改写选区、生成并复制增补内容，以及使用 Obsidian 原生流程创建文档链接。"
  - epic_id: e04
    title: "新标注数据格式与当前文档迁移"
    outcome: "正文标注、结果块、状态、标签和对话历史能够稳定关联，并支持当前文档的手动迁移和单次撤回。"
  - epic_id: e05
    title: "标注管理、状态推进与管家设置"
    outcome: "用户可以在当前文档和 Vault 入口管理标注、推进状态、设置标签并维护每个管家的快捷指令。"
out_of_scope:
  - item: "整个 Vault 的自动或默认批量迁移"
    reason: "延后到单文档迁移稳定后再评估，避免未经确认的大范围破坏性修改。"
  - item: "多人共享 Vault 的用户隔离、并发冲突和协作历史"
    reason: "当前产品定位是单用户本地 Vault，不具备多人身份和冲突解决需求。"
  - item: "增补结果自动写入当前文档或保存为插件历史"
    reason: "本次明确将增补结果定义为一次性剪贴板输出，避免引入额外内容生命周期。"
  - item: "链接操作的 AI 推荐、AI 解析或自定义链接选择器"
    reason: "链接属于 Obsidian 原生能力，重复实现会增加交互和兼容风险。"
  - item: "旧版格式作为新系统的长期规范格式"
    reason: "旧格式只承担迁移来源，不继续限制新的数据模型和 UI 设计。"
  - item: "覆盖 Ctrl+C 或实现独立于 Obsidian 的全局撤销快捷键"
    reason: "复制和撤销必须遵循操作系统与 Obsidian 的用户预期。"
constraints:
  - "目标用户为单用户、本地 Obsidian Vault 的阅读者和笔记作者。"
  - "桌面端与移动端同等支持；移动端核心操作必须避开软键盘和安全区域。"
  - "四个一级操作固定为对话、改写、增补、链接。"
  - "a、b、c 使用当前活动管家；每个管家独立维护自己的快捷指令。"
  - "对话历史需要跨 Obsidian 重启保持可恢复，但当前文档只展示最终结果。"
  - "旧格式迁移由用户主动触发，只处理当前文档，原地执行且不创建备份。"
  - "不改变用户未选中的原文内容；改写是唯一明确替换选区的 AI 流程。"
success_criteria:
  - "选中文本后，桌面和移动端都能发现并使用四个一级操作。"
  - "用户能选择管家指令完成对话标注，从标注末端继续对话、查看历史并撤回。"
  - "用户能立即改写选区，并通过 Ctrl+Z 或 Notice 按钮撤回。"
  - "用户能生成增补内容，结果自动进入剪贴板并能从 Notice 再次复制。"
  - "用户能保留选中文本并通过 Obsidian 原生流程链接到文档、标题或块。"
  - "标注结果、状态、标签和对话历史在 Obsidian 重启后仍保持正确关联。"
  - "手动删除或移动标注和结果内容时，不会产生无法解释的孤立关联。"
  - "用户能迁移当前旧格式文档，并通过一次 Ctrl+Z 撤回整次迁移。"
references:
  - "specs/planning-context.yaml"
  - "PLAN.md"
  - "README.md"
  - "branch: refactor/architecture-foundation"
